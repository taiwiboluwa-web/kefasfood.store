name: Apply Neon sync naming

on:
  push:
    paths:
      - .github/workflows/neon-naming-fix.yml

permissions:
  contents: write

jobs:
  fix-neon-naming:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Rename sync layer to Neon
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/app/AdminVisits.tsx')
          text = path.read_text(encoding='utf-8')

          replacements = {
              'syncFromSupabase': 'syncFromNeon',
              'syncAllToSupabase': 'syncAllToNeon',
              'syncFrom Supabase': 'syncFrom Neon',
              'syncAllTo Supabase': 'syncAllTo Neon',
              'Sync from Supabase first': 'Sync from Neon first',
              'Sync to Supabase for cross-account updates': 'Sync to Neon for cross-account updates',
              'Sync to Supabase': 'Sync to Neon',
              'Starting manual sync to Supabase...': 'Starting manual sync to Neon...',
              'First sync TO Supabase (push all local data to cloud)': 'First sync TO Neon (push all local data to cloud)',
              'Then sync FROM Supabase (pull latest data from cloud)': 'Then sync FROM Neon (pull latest data from cloud)',
              'Synced to Supabase successfully!': 'Synced to Neon successfully!',
              'Failed to sync with Supabase': 'Failed to sync with Neon',
              'Sync all data to Supabase cloud database': 'Sync all data to Neon cloud database',
              "{isSyncing ? 'Syncing...' : 'Sync to Cloud'}": "{isSyncing ? 'Syncing...' : 'Sync to Neon'}",
          }

          for old, new in replacements.items():
              text = text.replace(old, new)

          path.write_text(text, encoding='utf-8')
          PY

      - name: Verify Neon sync names
        shell: bash
        run: |
          grep -n "syncFromNeon\|syncAllToNeon\|Sync to Neon\|Failed to sync with Neon" src/app/AdminVisits.tsx
          if grep -n "syncFromSupabase\|syncAllToSupabase\|Failed to sync with Supabase" src/app/AdminVisits.tsx; then
            echo "Old sync names remain in AdminVisits.tsx"
            exit 1
          fi

      - name: Commit correction and remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/AdminVisits.tsx
          git rm .github/workflows/neon-naming-fix.yml
          git commit -m "feat: make Neon the visible cloud sync layer"
          git push
